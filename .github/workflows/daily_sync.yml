name: Daily Market Data Sync (SSI FastConnect v3)

on:
  schedule:
    # Runs automatically on GitHub Cloud (Mon-Fri) even when local PC is turned off:
    # 11:40 VN (04:40 UTC - morning break), 15:15 VN (08:15 UTC - close), 15:45 VN (08:45 UTC - EOD settle)
    - cron: "40 4 * * 1-5"
    - cron: "15 8 * * 1-5"
    - cron: "45 8 * * 1-5"
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-market-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run SSI FastConnect collector and export snapshot.json
        env:
          SSI_FC_BASE_URL: https://api.ssi.com.vn/api/v3
          SSI_CONSUMER_ID: ${{ secrets.SSI_CONSUMER_ID }}
          SSI_CONSUMER_SECRET: ${{ secrets.SSI_CONSUMER_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_TIMEZONE: Asia/Ho_Chi_Minh
        run: |
          PYTHONPATH=backend python backend/scripts/collect_ssi_session.py

      - name: Commit and push updated data (triggers Vercel auto-deploy)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data_sample/market_data.sqlite frontend/public/data/snapshot.json
          if git diff --staged --quiet; then
            echo "No new market data changes to commit."
          else
            git commit -m "chore(data): cloud auto-sync SSI market snapshot $(date -u +'%Y-%m-%d %H:%M')"
            git pull --rebase -X ours origin main
            git push
          fi
